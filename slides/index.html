<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>USJ-R SCS Specialization Track</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
    />

    <!-- Custom Theme -->
    <link rel="stylesheet" href="styles/custom.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--background);
        background-image: var(--background-gradient);
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: var(--text);
      }
      .landing-page {
        text-align: center;
        padding: 48px 40px;
        border-radius: 24px;
        background: var(--surface);
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
        box-shadow: var(--glass-outer-shadow), var(--glass-inner-shadow);
        border: var(--glass-border);
        max-width: 560px;
        width: 90%;
      }
      .landing-page h1 {
        font-family: 'Plus Jakarta Sans', 'DM Sans', sans-serif;
        font-size: 1.8rem;
        margin: 0 0 0.4em;
      }
      .landing-page p {
        margin: 0 0 1.5em;
        color: var(--text-muted);
      }
      .track-buttons {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .track-buttons a {
        display: block;
        padding: 16px 24px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
        color: #fff;
        box-shadow: var(--glass-outer-shadow);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .track-buttons a.secondary {
        background: var(--surface-hover);
        color: var(--text);
      }
      .track-buttons a:hover {
        transform: translateY(-3px);
        box-shadow: var(--glass-outer-shadow), 0 12px 30px var(--shadow-lg);
      }
    </style>
  </head>
  <body>
    <div class="landing-page">
      <h1>USJ-R SCS Specialization Track</h1>
      <p>Select a specialization track to view its presentation.</p>
      <div class="track-buttons">
        <a href="mobile.html">Mobile Applications Development (Flutter)</a>
        <a href="cybsec.html" class="secondary">Cybersecurity Track</a>
      </div>
    </div>
  </body>
</html>
