<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#grad1)"/>
  
  <!-- Inner glow ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
  
  <!-- Stacked layers representing learning/tracks -->
  <!-- Bottom layer (wider) -->
  <path d="M16 24 L6 19 L16 14 L26 19 Z" fill="url(#grad2)" opacity="0.9"/>
  
  <!-- Middle layer -->
  <path d="M16 20 L8 16 L16 12 L24 16 Z" fill="rgba(255,255,255,0.85)"/>
  
  <!-- Top layer (education cap style) -->
  <path d="M16 16 L10 13 L16 10 L22 13 Z" fill="white"/>
  
  <!-- Center diamond accent -->
  <path d="M16 11 L17.5 13 L16 15 L14.5 13 Z" fill="url(#grad1)"/>
  
  <!-- Small accent dots representing dual tracks -->
  <circle cx="9" cy="17" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="23" cy="17" r="1.2" fill="white" opacity="0.9"/>
</svg>
